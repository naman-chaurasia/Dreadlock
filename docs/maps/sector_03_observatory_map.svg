<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <pattern id="grid3" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#0e1724" stroke-width="1"/>
    </pattern>
    <radialGradient id="camCone3" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ff3333" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff3333" stop-opacity="0.0"/>
    </radialGradient>
    <radialGradient id="orreryGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0d2" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0077aa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#05080e" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background & Blueprint Grid -->
  <rect width="1000" height="700" fill="#05080e"/>
  <rect width="1000" height="700" fill="url(#grid3)"/>

  <!-- Outer Map Border & Header -->
  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#1d2e42" stroke-width="2"/>
  <rect x="25" y="25" width="950" height="40" fill="#0b131e"/>
  <text x="45" y="50" font-family="'Consolas', monospace" font-size="16" font-weight="bold" fill="#00f0d2" letter-spacing="2">DREADLOCK // TACTICAL SCHEMATIC: SECTOR 03 — THE OBSERVATORY</text>
  <text x="820" y="50" font-family="'Consolas', monospace" font-size="12" fill="#8da4b4">TIME BUDGET: 120 SEC</text>

  <!-- Camera Vision Cones (Behind geometry) -->
  <!-- Cam A (Central Orrery & Exit Seal) -->
  <path d="M 500 230 L 390 390 L 610 390 Z" fill="url(#camCone3)"/>
  <!-- Cam B (Rotating Bridge & Symbol B) -->
  <path d="M 850 370 L 670 260 L 670 480 Z" fill="url(#camCone3)"/>
  <!-- Cam C (Upper Ring & Symbol C) -->
  <path d="M 500 70 L 370 210 L 630 210 Z" fill="url(#camCone3)"/>
  <!-- Cam D (Lower Gallery & Symbol A) -->
  <path d="M 150 370 L 330 480 L 330 260 Z" fill="url(#camCone3)"/>

  <!-- Concentric Astronomical Rings & Architecture -->
  <!-- Outer Chamber Wall -->
  <circle cx="500" cy="370" r="280" fill="#0a121d" stroke="#25384d" stroke-width="3"/>
  <!-- Middle Tier Ring -->
  <circle cx="500" cy="370" r="210" fill="#080f18" stroke="#1d2e42" stroke-width="2" stroke-dasharray="8,4"/>
  <!-- Inner Orrery Basin -->
  <circle cx="500" cy="370" r="130" fill="#060c14" stroke="#25384d" stroke-width="2"/>

  <!-- Upper Ring Gallery (Sector North) -->
  <path d="M 360 170 A 280 280 0 0 1 640 170" fill="none" stroke="#00f0d2" stroke-width="24" stroke-opacity="0.3"/>
  <path d="M 360 170 A 280 280 0 0 1 640 170" fill="none" stroke="#00f0d2" stroke-width="2"/>

  <!-- Lower Gallery (Sector West) -->
  <rect x="220" y="320" width="100" height="100" fill="#0f1926" stroke="#25384d" stroke-width="2"/>

  <!-- Rotating Celestial Bridge (Sector East) -->
  <rect x="630" y="350" width="130" height="40" fill="#182c3f" stroke="#00f0d2" stroke-width="2" transform="rotate(15, 630, 370)"/>
  <circle cx="630" cy="370" r="8" fill="#ffaa22"/>
  <text x="695" y="335" font-family="'Consolas', monospace" font-size="9" fill="#00f0d2" text-anchor="middle">ROTATING BRIDGE</text>

  <!-- Central Orrery Sphere & Exit Seal Threshold -->
  <circle cx="500" cy="370" r="45" fill="url(#orreryGlow)" stroke="#00f0d2" stroke-width="2" filter="url(#glow3)"/>
  <circle cx="500" cy="370" r="18" fill="#00f0d2" fill-opacity="0.6"/>
  <text x="500" y="365" font-family="'Consolas', monospace" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">CENTRAL ORRERY</text>
  <text x="500" y="380" font-family="'Consolas', monospace" font-size="9" fill="#00f0d2" text-anchor="middle">&amp; EXIT SEAL</text>

  <!-- Guest Spawn (South Edge) -->
  <circle cx="500" cy="610" r="16" fill="#00f0d2" fill-opacity="0.2" stroke="#00f0d2" stroke-width="2"/>
  <text x="500" y="615" font-family="'Consolas', monospace" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">SPAWN</text>
  <text x="500" y="640" font-family="'Consolas', monospace" font-size="11" fill="#00f0d2" text-anchor="middle" font-weight="bold">GUEST SPAWN</text>

  <!-- Objectives: Symbol A, Symbol B, Symbol C -->
  <!-- Symbol A (Lower Gallery West) -->
  <circle cx="270" cy="370" r="12" fill="#00f0d2" stroke="#ffffff" stroke-width="2" filter="url(#glow3)"/>
  <text x="270" y="405" font-family="'Consolas', monospace" font-size="11" fill="#00f0d2" text-anchor="middle" font-weight="bold">SYMBOL A</text>
  <text x="270" y="418" font-family="'Consolas', monospace" font-size="9" fill="#8da4b4" text-anchor="middle">[LOWER GALLERY]</text>

  <!-- Symbol B (Across Rotating Bridge East) -->
  <circle cx="810" cy="370" r="12" fill="#00f0d2" stroke="#ffffff" stroke-width="2" filter="url(#glow3)"/>
  <text x="810" y="405" font-family="'Consolas', monospace" font-size="11" fill="#00f0d2" text-anchor="middle" font-weight="bold">SYMBOL B</text>
  <text x="810" y="418" font-family="'Consolas', monospace" font-size="9" fill="#8da4b4" text-anchor="middle">[EAST PERCH]</text>

  <!-- Symbol C (Upper Ring North) -->
  <circle cx="500" cy="130" r="12" fill="#00f0d2" stroke="#ffffff" stroke-width="2" filter="url(#glow3)"/>
  <text x="500" y="105" font-family="'Consolas', monospace" font-size="11" fill="#00f0d2" text-anchor="middle" font-weight="bold">SYMBOL C</text>
  <text x="500" y="118" font-family="'Consolas', monospace" font-size="9" fill="#8da4b4" text-anchor="middle">[UPPER RING]</text>

  <!-- Maintenance Stair Bypass (Perimeter walkway) -->
  <path d="M 320 420 A 240 240 0 0 0 680 420" fill="none" stroke="#ffaa22" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="500" y="530" font-family="'Consolas', monospace" font-size="10" fill="#ffaa22" text-anchor="middle">MAINTENANCE STAIR BYPASS</text>

  <!-- Warden CCTV Cameras -->
  <circle cx="500" cy="230" r="7" fill="#ff3333"/>
  <text x="500" y="220" font-family="'Consolas', monospace" font-size="10" fill="#ff5555" text-anchor="middle" font-weight="bold">CAM 01 [ORRERY &amp; SEAL]</text>
  <circle cx="850" cy="370" r="7" fill="#ff3333"/>
  <text x="850" y="355" font-family="'Consolas', monospace" font-size="10" fill="#ff5555" text-anchor="middle" font-weight="bold">CAM 02 [BRIDGE &amp; SYMBOL B]</text>
  <circle cx="500" cy="70" r="7" fill="#ff3333"/>
  <text x="500" y="60" font-family="'Consolas', monospace" font-size="10" fill="#ff5555" text-anchor="middle" font-weight="bold">CAM 03 [UPPER RING]</text>
  <circle cx="150" cy="370" r="7" fill="#ff3333"/>
  <text x="150" y="355" font-family="'Consolas', monospace" font-size="10" fill="#ff5555" text-anchor="middle" font-weight="bold">CAM 04 [LOWER GALLERY]</text>

  <!-- Darkness Pulse Indicator -->
  <circle cx="500" cy="370" r="280" fill="none" stroke="#ff3333" stroke-width="1" stroke-dasharray="2,6"/>

  <!-- Legend Box -->
  <rect x="40" y="520" width="220" height="140" fill="#0a1018" stroke="#1d2e42"/>
  <text x="50" y="540" font-family="'Consolas', monospace" font-size="10" fill="#00f0d2" font-weight="bold">MAP LEGEND</text>
  <circle cx="60" cy="560" r="5" fill="#00f0d2"/>
  <text x="75" y="563" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Guest Spawn / Symbol Node</text>
  <circle cx="60" cy="580" r="5" fill="#ffaa22"/>
  <text x="75" y="583" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Bridge / Stair Bypass</text>
  <circle cx="60" cy="600" r="5" fill="#ff3333"/>
  <text x="75" y="603" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Warden Camera / FOV</text>
  <circle cx="60" cy="620" r="5" fill="#00f0d2" stroke="#ffffff" stroke-width="1"/>
  <text x="75" y="623" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Central Orrery &amp; Exit Seal</text>
</svg>
