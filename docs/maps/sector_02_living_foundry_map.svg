<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <pattern id="grid2" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#0e1724" stroke-width="1"/>
    </pattern>
    <radialGradient id="camCone2" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ff3333" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff3333" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="liftGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0d2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffaa22" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background & Blueprint Grid -->
  <rect width="1000" height="700" fill="#05080e"/>
  <rect width="1000" height="700" fill="url(#grid2)"/>

  <!-- Outer Map Border & Header -->
  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#1d2e42" stroke-width="2"/>
  <rect x="25" y="25" width="950" height="40" fill="#0b131e"/>
  <text x="45" y="50" font-family="'Consolas', monospace" font-size="16" font-weight="bold" fill="#00f0d2" letter-spacing="2">DREADLOCK // TACTICAL SCHEMATIC: SECTOR 02 — THE LIVING FOUNDRY</text>
  <text x="820" y="50" font-family="'Consolas', monospace" font-size="12" fill="#8da4b4">TIME BUDGET: 120 SEC</text>

  <!-- Camera Vision Cones (Behind geometry) -->
  <!-- Cam A (Core & Lift) -->
  <path d="M 500 280 L 360 480 L 640 480 Z" fill="url(#camCone2)"/>
  <!-- Cam B (Assembly Walk & Platform) -->
  <path d="M 160 220 L 340 160 L 320 380 Z" fill="url(#camCone2)"/>
  <!-- Cam C (Pressure Chamber) -->
  <path d="M 840 220 L 680 380 L 660 160 Z" fill="url(#camCone2)"/>
  <!-- Cam D (Lower Maintenance Bypass) -->
  <path d="M 500 640 L 380 520 L 620 520 Z" fill="url(#camCone2)"/>

  <!-- Geometry Fills -->
  <!-- Intake Corridor -->
  <rect x="100" y="340" width="220" height="90" fill="#0c1420" stroke="#25384d" stroke-width="2"/>
  <!-- Central Foundry Core -->
  <rect x="380" y="300" width="240" height="170" fill="#0e1724" stroke="#25384d" stroke-width="2"/>
  <!-- Assembly Walk (Elevated Upper Left) -->
  <rect x="180" y="160" width="160" height="120" fill="#0a121d" stroke="#25384d" stroke-width="2"/>
  <!-- Pressure Chamber (Upper Right) -->
  <rect x="660" y="160" width="180" height="120" fill="#0a121d" stroke="#25384d" stroke-width="2"/>
  <!-- Service Lift Shaft & Exit Platform (Center Top) -->
  <rect x="440" y="100" width="120" height="140" fill="#09111b" stroke="#00f0d2" stroke-width="2" stroke-dasharray="4,2"/>
  <rect x="420" y="80" width="160" height="30" fill="#122538" stroke="#00f0d2" stroke-width="2"/>

  <!-- Connectors & Walkways -->
  <!-- Intake to Core -->
  <rect x="320" y="360" width="60" height="50" fill="#0c1420" stroke="#25384d" stroke-width="2"/>
  <!-- Assembly Walk to Core -->
  <path d="M 340 240 L 400 240 L 400 300" fill="none" stroke="#25384d" stroke-width="20"/>
  <!-- Pressure Chamber to Core -->
  <path d="M 660 240 L 600 240 L 600 300" fill="none" stroke="#25384d" stroke-width="20"/>
  <!-- Moving Platform Path -->
  <line x1="280" y1="280" x2="420" y2="280" stroke="#00f0d2" stroke-width="3" stroke-dasharray="5,3"/>
  <rect x="330" y="270" width="40" height="20" fill="#183648" stroke="#00f0d2" stroke-width="2"/>
  <text x="350" y="260" font-family="'Consolas', monospace" font-size="9" fill="#00f0d2" text-anchor="middle">MOVING PLATFORM</text>

  <!-- Lower Maintenance Bypass (Bottom loop) -->
  <path d="M 220 430 L 220 560 L 780 560 L 780 280" fill="none" stroke="#ffaa22" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="500" y="580" font-family="'Consolas', monospace" font-size="10" fill="#ffaa22" text-anchor="middle">LOWER MAINTENANCE BYPASS</text>

  <!-- Guest Spawn -->
  <circle cx="140" cy="385" r="16" fill="#00f0d2" fill-opacity="0.2" stroke="#00f0d2" stroke-width="2"/>
  <text x="140" y="390" font-family="'Consolas', monospace" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">SPAWN</text>
  <text x="140" y="355" font-family="'Consolas', monospace" font-size="10" fill="#00f0d2" text-anchor="middle" font-weight="bold">GUEST SPAWN</text>

  <!-- Objectives: Node A, Node B, Node C -->
  <!-- Node A (Intake Corridor) -->
  <circle cx="260" cy="385" r="12" fill="#00f0d2" stroke="#ffffff" stroke-width="2" filter="url(#glow2)"/>
  <text x="260" y="415" font-family="'Consolas', monospace" font-size="11" fill="#00f0d2" text-anchor="middle" font-weight="bold">NODE A</text>
  <text x="260" y="428" font-family="'Consolas', monospace" font-size="9" fill="#8da4b4" text-anchor="middle">[INTAKE CORRIDOR]</text>

  <!-- Node B (Assembly Walk) -->
  <circle cx="240" cy="210" r="12" fill="#00f0d2" stroke="#ffffff" stroke-width="2" filter="url(#glow2)"/>
  <text x="240" y="240" font-family="'Consolas', monospace" font-size="11" fill="#00f0d2" text-anchor="middle" font-weight="bold">NODE B</text>
  <text x="240" y="253" font-family="'Consolas', monospace" font-size="9" fill="#8da4b4" text-anchor="middle">[ASSEMBLY WALK]</text>

  <!-- Node C (Pressure Chamber) -->
  <circle cx="760" cy="210" r="12" fill="#00f0d2" stroke="#ffffff" stroke-width="2" filter="url(#glow2)"/>
  <text x="760" y="240" font-family="'Consolas', monospace" font-size="11" fill="#00f0d2" text-anchor="middle" font-weight="bold">NODE C</text>
  <text x="760" y="253" font-family="'Consolas', monospace" font-size="9" fill="#8da4b4" text-anchor="middle">[PRESSURE CHAMBER]</text>

  <!-- Steam Pressure Vent Hazard -->
  <circle cx="700" cy="220" r="10" fill="#441111" stroke="#ff3333" stroke-width="2"/>
  <text x="700" y="200" font-family="'Consolas', monospace" font-size="9" fill="#ff5555" text-anchor="middle">STEAM VENT</text>

  <!-- Central Molten Conduit Core -->
  <circle cx="500" cy="385" r="35" fill="#1b120c" stroke="#ffaa22" stroke-width="2"/>
  <text x="500" y="380" font-family="'Consolas', monospace" font-size="10" fill="#ffaa22" text-anchor="middle" font-weight="bold">FOUNDRY CORE</text>
  <text x="500" y="395" font-family="'Consolas', monospace" font-size="8" fill="#8da4b4" text-anchor="middle">[ENERGY SHAFT]</text>

  <!-- Service Lift & Console -->
  <rect x="460" y="140" width="80" height="70" fill="url(#liftGlow)" stroke="#ffffff" stroke-width="2" filter="url(#glow2)"/>
  <text x="500" y="170" font-family="'Consolas', monospace" font-size="11" fill="#05080e" text-anchor="middle" font-weight="bold">SERVICE LIFT</text>
  <text x="500" y="185" font-family="'Consolas', monospace" font-size="9" fill="#05080e" text-anchor="middle">[ACTIVATION CONSOLE]</text>

  <!-- Exit Platform -->
  <text x="500" y="100" font-family="'Consolas', monospace" font-size="12" fill="#00f0d2" text-anchor="middle" font-weight="bold">EXIT PLATFORM [ESCAPE]</text>

  <!-- Warden CCTV Cameras -->
  <circle cx="500" cy="280" r="7" fill="#ff3333"/>
  <text x="500" y="270" font-family="'Consolas', monospace" font-size="10" fill="#ff5555" text-anchor="middle" font-weight="bold">CAM 01 [LIFT &amp; CORE]</text>
  <circle cx="160" cy="220" r="7" fill="#ff3333"/>
  <text x="160" y="210" font-family="'Consolas', monospace" font-size="10" fill="#ff5555" text-anchor="middle" font-weight="bold">CAM 02 [ASSEMBLY WALK]</text>
  <circle cx="840" cy="220" r="7" fill="#ff3333"/>
  <text x="840" y="210" font-family="'Consolas', monospace" font-size="10" fill="#ff5555" text-anchor="middle" font-weight="bold">CAM 03 [PRESSURE CHAMBER]</text>
  <circle cx="500" cy="640" r="7" fill="#ff3333"/>
  <text x="500" y="655" font-family="'Consolas', monospace" font-size="10" fill="#ff5555" text-anchor="middle" font-weight="bold">CAM 04 [MAINTENANCE BYPASS]</text>

  <!-- Legend Box -->
  <rect x="40" y="520" width="220" height="140" fill="#0a1018" stroke="#1d2e42"/>
  <text x="50" y="540" font-family="'Consolas', monospace" font-size="10" fill="#00f0d2" font-weight="bold">MAP LEGEND</text>
  <circle cx="60" cy="560" r="5" fill="#00f0d2"/>
  <text x="75" y="563" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Guest Spawn / Conduit Node</text>
  <circle cx="60" cy="580" r="5" fill="#ffaa22"/>
  <text x="75" y="583" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Core Shaft / Alternate Route</text>
  <circle cx="60" cy="600" r="5" fill="#ff3333"/>
  <text x="75" y="603" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Warden Camera / Steam Vent</text>
  <rect x="55" y="615" width="12" height="6" fill="#00f0d2"/>
  <text x="75" y="621" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Service Lift Extraction</text>
</svg>
