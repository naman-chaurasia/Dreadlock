<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#0e1724" stroke-width="1"/>
    </pattern>
    <radialGradient id="camCone" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ff3333" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff3333" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="gateGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0d2" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00a3ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f0d2" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background & Blueprint Grid -->
  <rect width="1000" height="700" fill="#05080e"/>
  <rect width="1000" height="700" fill="url(#grid)"/>

  <!-- Outer Map Border & Header -->
  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#1d2e42" stroke-width="2"/>
  <rect x="25" y="25" width="950" height="40" fill="#0b131e"/>
  <text x="45" y="50" font-family="'Consolas', monospace" font-size="16" font-weight="bold" fill="#00f0d2" letter-spacing="2">DREADLOCK // TACTICAL SCHEMATIC: SECTOR 01 — THE ENTRY VAULT</text>
  <text x="820" y="50" font-family="'Consolas', monospace" font-size="12" fill="#8da4b4">TIME BUDGET: 120 SEC</text>

  <!-- Camera Vision Cones (Behind geometry) -->
  <!-- Cam A (Altar) -->
  <path d="M 500 240 L 400 420 L 600 420 Z" fill="url(#camCone)"/>
  <!-- Cam B (East Bay) -->
  <path d="M 850 180 L 660 300 L 780 440 Z" fill="url(#camCone)"/>
  <!-- Cam C (West Archive) -->
  <path d="M 150 180 L 220 440 L 340 300 Z" fill="url(#camCone)"/>
  <!-- Cam D (Blast Gate) -->
  <path d="M 500 620 L 410 490 L 590 490 Z" fill="url(#camCone)"/>

  <!-- Corridors & Chambers (Floor Fills) -->
  <!-- Main Hall -->
  <rect x="420" y="100" width="160" height="480" fill="#0c1420" stroke="#25384d" stroke-width="2"/>
  <!-- West Archive Wing -->
  <rect x="120" y="220" width="240" height="200" fill="#0a121d" stroke="#25384d" stroke-width="2"/>
  <!-- East Maintenance Bay -->
  <rect x="640" y="220" width="240" height="200" fill="#0a121d" stroke="#25384d" stroke-width="2"/>
  <!-- Corridor Connectors -->
  <rect x="360" y="290" width="60" height="60" fill="#0c1420" stroke="#25384d" stroke-width="2"/>
  <rect x="580" y="290" width="60" height="60" fill="#0c1420" stroke="#25384d" stroke-width="2"/>
  <!-- West Hazard Shortcut Bypass -->
  <path d="M 280 420 L 280 490 L 420 490" fill="none" stroke="#ffaa22" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Pillars / Structural Columns -->
  <rect x="450" y="160" width="20" height="20" fill="#1b2a3a" stroke="#334d66"/>
  <rect x="530" y="160" width="20" height="20" fill="#1b2a3a" stroke="#334d66"/>
  <rect x="450" y="440" width="20" height="20" fill="#1b2a3a" stroke="#334d66"/>
  <rect x="530" y="440" width="20" height="20" fill="#1b2a3a" stroke="#334d66"/>

  <!-- Central Altar & Entry Relay -->
  <rect x="470" y="300" width="60" height="60" fill="#122538" stroke="#00f0d2" stroke-width="2" filter="url(#glow)"/>
  <circle cx="500" cy="330" r="14" fill="#00f0d2" fill-opacity="0.3"/>
  <text x="500" y="380" font-family="'Consolas', monospace" font-size="11" fill="#00f0d2" text-anchor="middle" font-weight="bold">ENTRY RELAY</text>
  <text x="500" y="394" font-family="'Consolas', monospace" font-size="9" fill="#8da4b4" text-anchor="middle">[CELL RECEPTACLE A+B]</text>

  <!-- Power Conduits Lines -->
  <path d="M 500 360 L 500 570" fill="none" stroke="#00f0d2" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Guest Spawn -->
  <circle cx="500" cy="130" r="16" fill="#00f0d2" fill-opacity="0.2" stroke="#00f0d2" stroke-width="2"/>
  <text x="500" y="135" font-family="'Consolas', monospace" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">SPAWN</text>
  <text x="500" y="112" font-family="'Consolas', monospace" font-size="11" fill="#00f0d2" text-anchor="middle" font-weight="bold">GUEST SPAWN POINT</text>

  <!-- East Maintenance Bay: Power Cell A & Heavy Generator -->
  <rect x="740" y="240" width="60" height="40" fill="#1a2b1f" stroke="#22aa55" stroke-width="2"/>
  <text x="770" y="265" font-family="'Consolas', monospace" font-size="10" fill="#44ff88" text-anchor="middle">GENERATOR</text>
  <!-- Power Cell A -->
  <circle cx="770" cy="340" r="12" fill="#ffaa22" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  <text x="770" y="375" font-family="'Consolas', monospace" font-size="11" fill="#ffaa22" text-anchor="middle" font-weight="bold">POWER CELL A</text>
  <text x="770" y="388" font-family="'Consolas', monospace" font-size="9" fill="#8da4b4" text-anchor="middle">(EAST MAINTENANCE)</text>

  <!-- West Archive Wing: Power Cell B & Server Racks -->
  <rect x="140" y="240" width="30" height="70" fill="#141c27" stroke="#283a4e"/>
  <rect x="180" y="240" width="30" height="70" fill="#141c27" stroke="#283a4e"/>
  <!-- Keypad Door -->
  <line x1="360" y1="290" x2="360" y2="350" stroke="#ffaa22" stroke-width="4"/>
  <text x="345" y="325" font-family="'Consolas', monospace" font-size="9" fill="#ffaa22" text-anchor="end">KEYPAD DOOR</text>
  <!-- Power Cell B -->
  <circle cx="230" cy="340" r="12" fill="#ffaa22" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  <text x="230" y="375" font-family="'Consolas', monospace" font-size="11" fill="#ffaa22" text-anchor="middle" font-weight="bold">POWER CELL B</text>
  <text x="230" y="388" font-family="'Consolas', monospace" font-size="9" fill="#8da4b4" text-anchor="middle">(WEST ARCHIVE)</text>

  <!-- Laser / Pulse Trap on Shortcut -->
  <rect x="330" y="480" width="40" height="20" fill="#331111" stroke="#ff3333" stroke-width="2"/>
  <text x="350" y="472" font-family="'Consolas', monospace" font-size="9" fill="#ff4444" text-anchor="middle">LASER GRID TRAP</text>

  <!-- Blast Gate / Exit -->
  <rect x="440" y="570" width="120" height="18" fill="url(#gateGlow)" stroke="#ffffff" stroke-width="2"/>
  <text x="500" y="608" font-family="'Consolas', monospace" font-size="13" fill="#00f0d2" text-anchor="middle" font-weight="bold">SEALED BLAST GATE [EXIT]</text>

  <!-- Warden CCTV Cameras -->
  <!-- Cam A -->
  <circle cx="500" cy="240" r="7" fill="#ff3333"/>
  <text x="500" y="230" font-family="'Consolas', monospace" font-size="10" fill="#ff5555" text-anchor="middle" font-weight="bold">CAM 01 [ALTAR]</text>
  <!-- Cam B -->
  <circle cx="850" cy="180" r="7" fill="#ff3333"/>
  <text x="850" y="170" font-family="'Consolas', monospace" font-size="10" fill="#ff5555" text-anchor="middle" font-weight="bold">CAM 02 [EAST BAY]</text>
  <!-- Cam C -->
  <circle cx="150" cy="180" r="7" fill="#ff3333"/>
  <text x="150" y="170" font-family="'Consolas', monospace" font-size="10" fill="#ff5555" text-anchor="middle" font-weight="bold">CAM 03 [WEST ARCHIVE]</text>
  <!-- Cam D -->
  <circle cx="500" cy="620" r="7" fill="#ff3333"/>
  <text x="500" y="640" font-family="'Consolas', monospace" font-size="10" fill="#ff5555" text-anchor="middle" font-weight="bold">CAM 04 [BLAST GATE]</text>

  <!-- Legend & Telemetry Box -->
  <rect x="40" y="520" width="220" height="140" fill="#0a1018" stroke="#1d2e42"/>
  <text x="50" y="540" font-family="'Consolas', monospace" font-size="10" fill="#00f0d2" font-weight="bold">MAP LEGEND</text>
  <circle cx="60" cy="560" r="5" fill="#00f0d2"/>
  <text x="75" y="563" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Guest Spawn / Conduit</text>
  <circle cx="60" cy="580" r="5" fill="#ffaa22"/>
  <text x="75" y="583" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Power Cell Objective</text>
  <circle cx="60" cy="600" r="5" fill="#ff3333"/>
  <text x="75" y="603" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Warden Camera / FOV</text>
  <line x1="55" y1="620" x2="68" y2="620" stroke="#ffaa22" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="75" y="623" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Hazard Shortcut Route</text>
  <rect x="55" y="635" width="12" height="6" fill="#00f0d2"/>
  <text x="75" y="641" font-family="'Consolas', monospace" font-size="9" fill="#c4d1db">Blast Gate Exit</text>
</svg>
